[project]
name = "dailyinspiration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "김영환", email = "cromi0256@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-mcp-adapters>=0.3.2",
    "notebook>=7.6.2",
